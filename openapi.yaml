components:
  schemas:
    AccommodationIn:
      properties:
        job_id:
          type: string
          maxLength: 100
          title: Job Id
        needs:
          items:
            type: string
            enum:
            - interpreter
            - extra_time
            - written_questions
            - accessible_venue
            - other
          type: array
          minItems: 1
          title: Needs
        note:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Note
        contact_channel:
          type: string
          enum:
          - none
          - telegram
          - sms
          - email
          title: Contact Channel
          default: none
        contact:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Contact
        language:
          type: string
          enum:
          - am
          - en
          - ar
          - om
          - ti
          - so
          title: Language
          default: am
      type: object
      required:
      - job_id
      - needs
      title: AccommodationIn
    AlertIn:
      properties:
        channel:
          type: string
          enum:
          - telegram
          - sms
          title: Channel
        address:
          type: string
          maxLength: 40
          minLength: 3
          title: Address
          description: Telegram chat id or phone (09…, 07…, +251…)
        keyword:
          type: string
          maxLength: 100
          title: Keyword
          default: ''
        location:
          type: string
          maxLength: 100
          title: Location
          default: ''
        language:
          type: string
          enum:
          - am
          - en
          - ar
          - om
          - ti
          - so
          title: Language
          default: am
      type: object
      required:
      - channel
      - address
      title: AlertIn
    AskIn:
      properties:
        question:
          type: string
          maxLength: 1000
          minLength: 1
          title: Question
          examples:
          - AI ምናባዊ ረዳቶችን ይተካል?
        language:
          type: string
          enum:
          - am
          - en
          - ar
          - om
          - ti
          - so
          title: Language
          default: am
        page_url:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Page Url
        conversation_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Conversation Id
        allow_ai:
          type: boolean
          title: Allow Ai
          description: Learner consented to online AI answers (NFR-S2)
          default: false
        simple:
          type: boolean
          title: Simple
          default: false
        sections:
          anyOf:
          - items:
              $ref: '#/components/schemas/PageSectionIn'
            type: array
          - type: 'null'
          title: Sections
          description: Optional sections read from the page (FR-AD4). At most 50 are
            used; never stored.
      type: object
      required:
      - question
      title: AskIn
    AskOut:
      properties:
        answer:
          anyOf:
          - type: string
          - type: 'null'
          title: Answer
          description: null when not found in the course or refused
        sources:
          items:
            $ref: '#/components/schemas/Source'
          type: array
          title: Sources
        provider:
          type: string
          title: Provider
          description: gemini | groq | ollama | none
        language:
          type: string
          title: Language
        conversation_id:
          type: string
          title: Conversation Id
        reason:
          anyOf:
          - type: string
            enum:
            - not_found
            - no_advice
          - type: 'null'
          title: Reason
        audio:
          items:
            type: string
          type: array
          title: Audio
          description: Pre-generated audio paths under /module/audio/
      type: object
      required:
      - answer
      - sources
      - provider
      - language
      - conversation_id
      title: AskOut
    Body_transcribe_api_v1_voice_transcribe_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        language:
          type: string
          title: Language
          description: am, en, om, ti, so, ar, or auto
          default: auto
      type: object
      required:
      - file
      title: Body_transcribe_api_v1_voice_transcribe_post
    ConfigOut:
      properties:
        ai:
          type: boolean
          title: Ai
          description: An AI provider is configured; the widget shows the consent
            card
        provider:
          type: string
          title: Provider
        helper_online:
          type: boolean
          title: Helper Online
        telegram_bot:
          anyOf:
          - type: string
          - type: 'null'
          title: Telegram Bot
        page_sections:
          type: integer
          title: Page Sections
          description: Stored sections for page_url (0 = the widget may read the page,
            FR-AD4)
          default: 0
      type: object
      required:
      - ai
      - provider
      - helper_online
      title: ConfigOut
    ContentIn:
      properties:
        sections:
          items:
            $ref: '#/components/schemas/SectionIn'
          type: array
          minItems: 1
          title: Sections
      type: object
      required:
      - sections
      title: ContentIn
    ContentOut:
      properties:
        sections:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Sections
      type: object
      required:
      - sections
      title: ContentOut
    ConversationLine:
      properties:
        role:
          type: string
          enum:
          - learner
          - assistant
          - tutor
          - helper
          - system
