      tags:
      - human help
      summary: 'Talk to a person: open a ticket'
      operationId: create_escalation_api_v1_escalations_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - human help
      summary: 'Helper page: tickets by status'
      operationId: list_escalations_api_v1_escalations_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          pattern: ^(waiting|active|closed|open|all)$
          default: waiting
          title: Status
      - name: x-helper-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Helper-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketOut'
                title: Response List Escalations Api V1 Escalations Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/escalations/{ticket_id}/screenshot:
