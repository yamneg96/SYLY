          type: string
          title: Author
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        text:
          type: string
          title: Text
        lang:
          anyOf:
          - type: string
          - type: 'null'
          title: Lang
        sources:
          items: {}
          type: array
          title: Sources
          default: []
        created_at:
          type: string
