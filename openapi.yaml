# Generated from the FastAPI app: python api/scripts/export_openapi.py
openapi: 3.1.0
info:
  title: SYLY db-assistant API
  description: Course-grounded multilingual assistant, human help, text route and
    career gateway (Track 3).
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      tags:
      - assistant
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Api V1 Health Get
  /api/v1/ask:
    post:
      tags:
      - assistant
      summary: Answer a question from the course, with sources
      operationId: ask_api_v1_ask_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/translate:
    post:
      tags:
      - assistant
      summary: Translate an answer into the learner's language (needs consent)
      operationId: translate_text_api_v1_translate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslateIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslateOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/content:
    get:
      tags:
      - assistant
      summary: The indexed sections (lessons and jobs)
      operationId: get_content_api_v1_content_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentOut'
    post:
      tags:
      - assistant
      summary: Host sends its lessons to be indexed
      operationId: post_content_api_v1_content_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Created'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/config:
    get:
      tags:
      - assistant
      summary: What the widget needs to know at start
      operationId: get_config_api_v1_config_get
      parameters:
      - name: page_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Page Url
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/escalations:
