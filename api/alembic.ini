# Database migrations (Alembic). The API runs "upgrade head" on start-up, so a judge needs no extra step.
# Manual use, from the api/ folder:  python migrate.py   |   alembic revision -m "what changed"
# The database URL comes from DATABASE_URL (SQLite file in DATA_DIR when empty): see migrations/env.py.
[alembic]
script_location = %(here)s/migrations
