# Behind a Cloudflare tunnel or an HTTPS proxy the browser's scheme arrives in X-Forwarded-Proto: keep it,
# so the API can mark the developer session cookie Secure.
map $http_x_forwarded_proto $syly_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /srv/web;
    index index.html;

    # JSON and the module script are small; gzip helps on 3G (NFR-E4).
    gzip on;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $syly_proto;
        proxy_read_timeout 30s;
    }
    location /sms/ {
        proxy_pass http://api:8000/sms/;
        proxy_set_header Host $host;
    }
    location = /docs { proxy_pass http://api:8000/docs; }
    location = /openapi.json { proxy_pass http://api:8000/openapi.json; }

    # The widget runs on other sites: its script, dictionaries, audio and the public demo
    # content must be readable cross-site (CORS). They are public files; no cookies involved.
    location /module/ {
        alias /srv/module/;
        add_header Access-Control-Allow-Origin "*" always;
        location ~ ^/module/(node_modules|tests|scripts|package) { return 404; }
    }
    location /demo/ {
        alias /srv/demo/;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # The Savanna starter's own index (the list of its three pages) stays reachable here.
    location = /starter {
        root /srv/savanna;
        try_files /index.html =404;
    }

    # The portal (web/, a React app built into /srv/web) answers first at /. Every other path (/pages, /assets, ...)
    # is the Savanna starter, unchanged. A path that is neither (/documentation, /signin, /dashboard) is a page of the
    # portal: the app starts and shows it. The files the app builds live under /portal-assets, never /assets.
    location / {
        try_files $uri $uri/ @savanna;
    }
    location @savanna {
        root /srv/savanna;
        try_files $uri $uri/ @portal;
    }
    location @portal {
        root /srv/web;
        try_files /index.html =404;
    }
    location /portal-assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
